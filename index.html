<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SUZU Can Viewer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    #canvas-wrap {
      width: 100%;
      height: 100%;
      position: relative;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* Loading overlay */
    #loader {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    #loader.hidden { opacity: 0; }

    .spinner {
      width: 36px;
      height: 36px;
      border: 2px solid rgba(255,255,255,0.15);
      border-top-color: rgba(255,255,255,0.7);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="canvas-wrap">
    <div id="loader"><div class="spinner"></div></div>
  </div>

  <!-- Three.js r169 via importmap -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>

  <!-- GSAP + ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader }   from 'three/addons/loaders/DRACOLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // ─── CONFIG ──────────────────────────────────────────────────────────────
    // When embedding in Webflow:
    //   1. Upload SUZU_can.glb to Webflow Assets
    //   2. Replace GLB_URL with the Webflow CDN URL (e.g. "https://uploads-ssl.webflow.com/…/SUZU_can.glb")
    const GLB_URL = './suzu_upload_SUZU_can.glb';

    const CAMERA_FOV      = 38;
    const CAMERA_NEAR     = 0.01;
    const CAMERA_FAR      = 50;
    const CAMERA_DISTANCE = 0.38;    // metres from can centre
    const CAMERA_HEIGHT   = 0.00;    // centred on can
    const AUTO_ROTATE_SPEED = 1.2;   // degrees/frame factor
    const ENV_INTENSITY   = 0.55;
    const EXPOSURE        = 0.78;
    // ─────────────────────────────────────────────────────────────────────────

    const wrap   = document.getElementById('canvas-wrap');
    const loader = document.getElementById('loader');

    // ── Renderer ─────────────────────────────────────────────────────────────
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,          // transparent canvas background
      powerPreference: 'high-performance',
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(wrap.clientWidth, wrap.clientHeight);
    renderer.toneMapping        = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = EXPOSURE;
    renderer.outputColorSpace   = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled  = false;
    wrap.appendChild(renderer.domElement);

    // ── Scene & Camera ────────────────────────────────────────────────────────
    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(
      CAMERA_FOV,
      wrap.clientWidth / wrap.clientHeight,
      CAMERA_NEAR,
      CAMERA_FAR
    );
    camera.position.set(0, CAMERA_HEIGHT, CAMERA_DISTANCE);

    // ── Environment (studio room — ideal for metallic PBR) ────────────────────
    const pmrem = new THREE.PMREMGenerator(renderer);
    pmrem.compileEquirectangularShader();
    const envTexture = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
    scene.environment          = envTexture;
    scene.environmentIntensity = ENV_INTENSITY;

    // ── Studio lights (key + fill + rim) ─────────────────────────────────────
    const keyLight = new THREE.DirectionalLight(0xd0e8ff, 1.8);
    keyLight.position.set(1.5, 2.0, 1.5);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xfff0e8, 0.6);
    fillLight.position.set(-1.5, 0.5, -1.0);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xaaccff, 0.9);
    rimLight.position.set(0, 1.0, -2.0);
    scene.add(rimLight);

    // ── Controls ──────────────────────────────────────────────────────────────
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.015, 0);
    controls.enableDamping   = true;
    controls.dampingFactor   = 0.06;
    controls.autoRotate      = true;
    controls.autoRotateSpeed = AUTO_ROTATE_SPEED;
    controls.enablePan       = false;
    controls.minDistance     = 0.12;
    controls.maxDistance     = 0.90;
    controls.minPolarAngle   = Math.PI * 0.15;
    controls.maxPolarAngle   = Math.PI * 0.80;
    controls.update();

    // ── Pause auto-rotate while user drags ───────────────────────────────────
    renderer.domElement.addEventListener('pointerdown', () => { controls.autoRotate = false; });
    renderer.domElement.addEventListener('pointerup',   () => { controls.autoRotate = true;  });

    // ── Load GLB ──────────────────────────────────────────────────────────────
    let canModel = null;

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath(
      'https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/libs/draco/'
    );

    const gltfLoader = new GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);

    gltfLoader.load(
      GLB_URL,
      (gltf) => {
        canModel = gltf.scene;

        // Center model at world origin
        const box    = new THREE.Box3().setFromObject(canModel);
        const center = box.getCenter(new THREE.Vector3());
        canModel.position.sub(center);

        // Fix materials for TurboSquid PBR can + water-drop overlay.
        // The metallic map from TurboSquid drives values near 1.0, which at full
        // strength makes the PBR material fully mirror-like and hides the SUZU label.
        // Capping metalness at 0.25 (× map value ≈ 0.15–0.22) lets the base-color
        // label show while keeping the aluminium character.
        // Three-layer sandwich: can body (metallic) → label band (non-metallic) → water drops
        canModel.traverse((node) => {
          if (node.isMesh && node.material) {
            const mats = Array.isArray(node.material) ? node.material : [node.material];
            const name = (node.name || '').toLowerCase();
            mats.forEach((mat) => {
              if (mat.map) {
                mat.map.colorSpace = THREE.SRGBColorSpace;
                // Keeps label text crisp where the can curves away from the camera
                mat.map.anisotropy = renderer.capabilities.getMaxAnisotropy();
              }

              if (name.includes('label_band')) {
                // Label band: non-metallic so base-color shows through.
                // envMapIntensity gives subtle reflection to match the aluminium look.
                mat.metalness       = 0.0;
                mat.roughness       = 0.20;
                mat.envMapIntensity = 1.2;
                // Transparent alpha; FrontSide only prevents back-face from showing through
                mat.transparent     = true;
                mat.alphaTest       = 0.01;
                mat.side            = THREE.FrontSide;
                mat.depthWrite      = false;
              } else if (name.includes('droplet')) {
                // Water condensation: glossy, zero metalness
                mat.metalness       = 0.0;
                mat.roughness       = 0.08;
                mat.envMapIntensity = 1.0;
              } else {
                // Aluminium can body: keep PBR metallic map, just cap scalar
                mat.metalness       = 0.85;
                mat.roughness       = 0.30;
                mat.envMapIntensity = 0.9;
              }
              mat.needsUpdate = true;
            });
          }
        });

        scene.add(canModel);

        // Hide spinner
        loader.classList.add('hidden');
        setTimeout(() => { loader.style.display = 'none'; }, 700);

        // Intro: fade-in + gentle rise
        canModel.scale.setScalar(0.001);
        canModel.position.y -= 0.04;
        gsap.to(canModel.scale, {
          x: 1, y: 1, z: 1,
          duration: 1.0,
          ease: 'back.out(1.4)',
        });
        gsap.to(canModel.position, {
          y: 0,
          duration: 1.0,
          ease: 'power3.out',
        });
      },
      undefined,
      (err) => {
        console.error('[SUZU] GLB load error:', err);
        loader.innerHTML = '<span style="color:rgba(255,255,255,.5);font-size:12px">Model unavailable</span>';
      }
    );

    // ── GSAP ScrollTrigger — scroll drives Y rotation ─────────────────────────
    // Works when this file is embedded inside a Webflow page that has a scroll container.
    // The can completes one full rotation over 100 vh of scroll.
    if (typeof ScrollTrigger !== 'undefined') {
      gsap.registerPlugin(ScrollTrigger);

      const scrollState = { radians: 0 };

      ScrollTrigger.create({
        trigger: document.body,
        start: 'top top',
        end:   'bottom bottom',
        scrub: 1.2,
        onUpdate: (self) => {
          scrollState.radians = self.progress * Math.PI * 2;
        },
      });

      // Expose scrollState so the render loop can apply it
      window.__suzuScroll = scrollState;
    }

    // ── Resize ────────────────────────────────────────────────────────────────
    const onResize = () => {
      const w = wrap.clientWidth;
      const h = wrap.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    };
    window.addEventListener('resize', onResize);

    // ── Render loop ───────────────────────────────────────────────────────────
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta(); // keep clock ticking even if not used

      // Apply scroll-driven rotation on top of auto-rotate
      if (canModel && window.__suzuScroll) {
        canModel.rotation.y = window.__suzuScroll.radians;
        controls.autoRotate = false; // scroll takes over
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
